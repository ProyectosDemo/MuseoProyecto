<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <header>
        <h1>Museo Aurora - Área de Trabajadores</h1>
    </header>

    <section class="login-container">
        <div class="login-box">
            <h2>Iniciar Sesión Trabajador</h2>

            <form id="loginTrabajadorForm" autocomplete="off">
                <input type="text" style="display:none">

                <div class="input-group">
                    <label for="login_fake">Usuario</label>
                    <input type="text" id="login_fake" name="login_fake"required
                   autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password_fake">Contraseña</label>
                    <input type="password" id="password_fake" name="password_fake"required
                   autocomplete="off">
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p style="margin-top: 1em; text-align: center;">
                ¿Eres cliente?
                <a href="login.html" class="btn-secondary">Iniciar sesión como cliente</a>
            </p>
        </div>
    </section>

    <footer>
        © 2026 Museo Aurora
    </footer>
    <script src="../js/login-trabajadores.js" defer></script> <!-- carga primero el DOM luego el script -->

</body>
</html>
