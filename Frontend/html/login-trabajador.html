<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Trabajador | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>Museo Aurora - Área de Trabajadores</h1>
</header>

<section class="login-container">
    <div class="login-box">
        <h2>Iniciar Sesión Trabajador</h2>

        <form id="loginTrabajadorForm">
            <div class="input-group">
                <label for="login">Usuario</label>
                <input type="text" id="login" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <!-- Link de vuelta a login de clientes -->
        <p style="margin-top: 1em; text-align: center;">
            ¿Eres cliente? 
            <a href="login.html" class="btn-secondary">Iniciar sesión como cliente</a>
        </p>
    </div>
</section>

<footer>
    © 2026 Museo Aurora
</footer>

<script>
const form = document.getElementById("loginTrabajadorForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const login = document.getElementById("login").value;
    const password = document.getElementById("password").value;

    // Query GraphQL para login de trabajador
    const query = `
        query {
            loginTrabajador(login: "${login}", password: "${password}") {
                success
                id
                nombre
                admin
            }
        }
    `;

    try {
        const res = await fetch("http://localhost:8080/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query })
        });

        const data = await res.json();

        const trabajador = data.data.loginTrabajador;

        if (trabajador.success) {
            localStorage.setItem("trabajadorNombre", trabajador.nombre);
            localStorage.setItem("trabajadorId", trabajador.id);
            localStorage.setItem("trabajadorAdmin", trabajador.admin);

            // Redirige si es admin o no
            if (trabajador.admin) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "index.html";
            }
        } else {
            alert("Usuario o contraseña incorrectos");
        }

    } catch (err) {
        console.error(err);
        alert("Error conectando al servidor");
    }
});
</script>

</body>
</html>
