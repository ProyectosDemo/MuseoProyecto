<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Artista-Genero | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/menu-lateral.css">
    <link rel="stylesheet" href="/static/css/artista-genero.css">
</head>
<body>

<header>
    <h1>Gestión de Artista-Genero</h1>
    <nav id="navMenu">
        <a href="index.html">Inicio</a>
        <a href="login.html" id="loginButton">Iniciar Sesión</a>
    </nav>
</header>

<div class="admin-panel">

    <aside class="side-menu" id="menuLateral" hidden>
        <h3>Artista-Genero</h3>
        <ul>
           <li><a href="admin-clientes.html">Clientes</a></li>
           <li><a href="admin-trabajadores.html">Trabajadores</a></li>
           <li><a href="admin-obras.html">Obras</a></li>
           <li><a href="admin-artistas.html">Artistas</a></li>
           <li><a href="admin-generos.html">Géneros</a></li>
           <li><a href="admin-artista_genero.html">Artista-Genero</a></li>
           <li><a href="admin-membresias.html">Membresías</a></li>
           <li><a href="admin-tarjetas.html">Tarjetas</a></li>
           <li><a href="admin-preguntas.html">Preguntas</a></li>
           <li><a href="admin.html">Panel de Control</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <div class="action-buttons-container">
            <div class="action-buttons">
                <button id="btnCrear">Crear</button>
                <button id="btnEditar">Editar</button>
                <button id="btnEliminar">Eliminar</button>
                <button id="btnObtener">Obtener</button>
            </div>
        </div>

        <div class="content-container">
            <div id="contenidoArtistaGenero"></div>
        </div>
    </div>

</div>

<footer>
    © 2026 Museo Aurora | Todos los derechos reservados
</footer>

<script>
const navMenu = document.getElementById("navMenu");
const loginButton = document.getElementById("loginButton");
const trabajadorId = localStorage.getItem("trabajadorId");
const trabajadorNombre = localStorage.getItem("trabajadorNombre");
const trabajadorAdmin = localStorage.getItem("trabajadorAdmin");

if (!trabajadorId) {
    console.log("Debe iniciar sesión como trabajador para usar esta página");
    location.href = "login.html";
}

if (trabajadorAdmin === "true") {
    document.getElementById("menuLateral").hidden = false;
}

loginButton.textContent = `Bienvenido, ${trabajadorNombre || "Trabajador"}`;
loginButton.href = "#";

const logoutBtn = document.createElement("a");
logoutBtn.href = "#";
logoutBtn.textContent = "Cerrar Sesión";
logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("trabajadorNombre");
    localStorage.removeItem("trabajadorId");
    localStorage.removeItem("trabajadorAdmin");
    location.reload();
});
navMenu.appendChild(logoutBtn);

const contenido = document.getElementById("contenidoArtistaGenero");
const endpoint = "http://localhost:8080/query";

function limpiar() {
    contenido.innerHTML = "";
}

async function fetchGraphQL(query, variables = {}) {
    const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables })
    });
    return await res.json();
}

document.getElementById("btnCrear").addEventListener("click", () => {
    limpiar();

    contenido.innerHTML = `
        <form id="formCrear" class="form-container">
            <input type="text" id="id_artista" placeholder="ID Artista" required>
            <input type="text" id="id_genero" placeholder="ID Genero" required>
            <div class="form-buttons">
                <button type="button" id="cancelarCrear" class="btn-cancel">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar</button>
            </div>
        </form>
    `;

    document.getElementById("formCrear").addEventListener("submit", async e => {
        e.preventDefault();

        const query = `
            mutation ($input: NewArtistaGenero!) {
                createArtistaGenero(input: $input) {
                    id_artista
                    id_genero
                }
            }
        `;

        const variables = {
            input: {
                id_artista: document.getElementById("id_artista").value,
                id_genero: document.getElementById("id_genero").value
            }
        };

        const data = await fetchGraphQL(query, variables);
        console.log(data);

        if (data.errors) {
            console.error(data.errors);
            alert("Error al crear relación Artista-Genero");
        } else {
            alert("Relación creada correctamente");
            limpiar();
        }
    });

    document.getElementById("cancelarCrear").addEventListener("click", limpiar);
});

document.getElementById("btnObtener").addEventListener("click", async () => {
    limpiar();

    const query = `
        query ObtenerArtistaGenero($limit: Int, $offset: Int) {
            ArtistaGenero(limit: $limit, offset: $offset) {
                id_artista
                artista {
                    nombre
                }
                id_genero
                genero {
                    nombre
                }
            }
        }
    `;

    const variables = { limit: 100, offset: 0 };

    const data = await fetchGraphQL(query, variables);
    console.log(data);

    let relaciones = data?.data?.ArtistaGenero;

    if (!relaciones || relaciones.length === 0) {
        contenido.innerHTML = "<p>No hay relaciones registradas.</p>";
        return;
    }

    const agrupados = {};
    relaciones.forEach(r => {
        if (!agrupados[r.genero.nombre]) {
            agrupados[r.genero.nombre] = [];
        }
        agrupados[r.genero.nombre].push({ nombre: r.artista.nombre, id: r.id_artista });
    });

    const generosOrdenados = Object.keys(agrupados).sort((a, b) => a.localeCompare(b));

    let html = '<div class="ag-grid-container">';

    generosOrdenados.forEach(genero => {
        html += `<div class="ag-grid-item">
                    <h4>${genero}</h4>
                    <ul>`;
        agrupados[genero].forEach(artista => {
            html += `<li>${artista.nombre}  <strong>ID:</strong> ${artista.id}</li>`;
        });
        html += `   </ul>
                 </div>`;
    });

    html += '</div>';

    contenido.innerHTML = html;
});


document.getElementById("btnEliminar").addEventListener("click", async () => {
    limpiar();

    const query = `
        query ($limit: Int, $offset: Int) {
            ArtistaGenero(limit: $limit, offset: $offset) {
                id_artista
                id_genero
                artista { nombre }
            }
        }
    `;
    const variables = { limit: 100, offset: 0 };
    const data = await fetchGraphQL(query, variables);
    const relaciones = data?.data?.ArtistaGenero;

    if (!relaciones || relaciones.length === 0) {
        contenido.innerHTML = "<p>No hay relaciones para eliminar.</p>";
        return;
    }

    const opciones = relaciones.map(r => `<option value="${r.id_artista}|${r.id_genero}">${r.artista.nombre}</option>`).join("");

    contenido.innerHTML = `
        <select id="selectRelacion" class="select-box">${opciones}</select>
        <div class="form-buttons">
            <button id="cancelarEliminar" class="btn-cancel">Cancelar</button>
            <button id="confirmarEliminar" class="btn-delete">Eliminar</button>
        </div>
    `;

    document.getElementById("confirmarEliminar").addEventListener("click", async () => {
        const val = document.getElementById("selectRelacion").value;
        if (!val) return alert("Selecciona una relación para eliminar");

        const [idArtista, idGenero] = val.split("|");

        const mutation = `
            mutation KillArtistaGenero($idArtista: ID!, $idGenero: ID!) {
                killArtistaGenero(id_artista: $idArtista, id_genero: $idGenero)
            }
        `;
        const variables = { idArtista, idGenero };

        const result = await fetchGraphQL(mutation, variables);
        if (result.errors) {
            console.error(result.errors);
            alert("Error al eliminar relación");
        } else if (result.data.killArtistaGenero) {
            alert("Relación eliminada correctamente");
            limpiar();
        } else {
            alert("No se pudo eliminar la relación");
        }
    });

    document.getElementById("cancelarEliminar").addEventListener("click", limpiar);
});

document.getElementById("btnEditar").addEventListener("click", async () => {
    limpiar();

    const query = `
        query ($limit: Int, $offset: Int) {
            ArtistaGenero(limit: $limit, offset: $offset) {
                id_artista
                id_genero
            }
        }
    `;
    const variables = { limit: 100, offset: 0 };
    const data = await fetchGraphQL(query, variables);
    const relaciones = data?.data?.ArtistaGenero;

    if (!relaciones || relaciones.length === 0) {
        contenido.innerHTML = "<p>No hay relaciones para editar.</p>";
        return;
    }

    const opciones = relaciones.map(r => `<option value="${r.id_artista}|${r.id_genero}">${r.id_artista} - ${r.id_genero}</option>`).join("");

    contenido.innerHTML = `
        <select id="selectRelacion" class="select-box">${opciones}</select>
        <form id="updateForm" class="form-container"></form>
    `;

    const form = document.getElementById("updateForm");
    form.classList.add("edit-form");

    function renderForm(rel) {
        if (!rel) return;
        form.innerHTML = `
            <input type="text" id="id_artista" value="${rel.id_artista}" required>
            <input type="text" id="id_genero" value="${rel.id_genero}" required>
            <div class="form-buttons">
                <button type="button" id="cancelarEditar" class="btn-cancel">Cancelar</button>
                <button type="submit" class="btn-primary">Actualizar</button>
            </div>
        `;

        document.getElementById("updateForm").addEventListener("submit", async e => {
            e.preventDefault();

            const mutation = `
                mutation updateArtistaGenero($input: UpdateArtistaGenero!) {
                    updateArtistaGenero(input: $input) {
                        id_artista
                        id_genero
                    }
                }
            `;

            const variables = {
                input: {
                    id_artista: rel.id_artista,
                    id_genero: rel.id_genero,
                    nuevo_id_artista: document.getElementById("id_artista").value,
                    nuevo_id_genero: document.getElementById("id_genero").value
                }
            };

            const result = await fetchGraphQL(mutation, variables);
            if (result.errors) {
                console.error(result.errors);
                alert("Error al actualizar relación");
            } else {
                alert("Relación actualizada correctamente");
                limpiar();
            }
        });

        document.getElementById("cancelarEditar").addEventListener("click", limpiar);
    }

    renderForm(relaciones[0]);

    document.getElementById("selectRelacion").addEventListener("change", e => {
        const [idArtista, idGenero] = e.target.value.split("|");
        const rel = relaciones.find(r => r.id_artista === idArtista && r.id_genero === idGenero);
        renderForm(rel);
    });
});
</script>

</body>
</html>
