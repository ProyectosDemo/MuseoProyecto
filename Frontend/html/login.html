<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Museo de Arte Contemporáneo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <header>
        <h1>Museo de Arte Contemporáneo</h1>
    </header>

    <section class="login-container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>

            <input type="text" class="hidden-input" autocomplete="username">
            <input type="password" class="hidden-input" autocomplete="new-password">

            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="login">Usuario</label>
                    <input type="text" id="login" name="login" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p>
                ¿Eres trabajador?
                <a href="login-trabajador.html" class="btn-secondary">Iniciar sesión como trabajador</a>
            </p>

            <p>
                ¿No tienes cuenta?
                <a href="registro.html" class="btn-secondary">Crear cuenta</a>
            </p>
        </div>
    </section>

    <footer>
       © 2026 Museo de Arte Contemporáneo | Todos los derechos reservados
    </footer>

    <script src="../js/login.js" defer></script> <!-- carga primero el DOM luego el script -->

</body>
</html>
