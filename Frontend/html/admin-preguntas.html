<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Preguntas | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/menu-lateral.css">
</head>
<body>

<header>
    <h1>Gestión de Preguntas</h1>
    <nav id="navMenu">
        <a href="index.html">Inicio</a>
        <a href="login.html" id="loginButton">Iniciar Sesión</a>
    </nav>
</header>

<div class="admin-panel">

    <aside class="side-menu" id="menuLateral" hidden>
        <h3>Preguntas</h3>
        <ul>
           <li><a href="admin-clientes.html">Clientes</a></li>
            <li><a href="admin-trabajadores.html">Trabajadores</a></li>
            <li><a href="admin-obras.html">Obras</a></li>
            <li><a href="admin-artistas.html">Artistas</a></li>
            <li><a href="admin-generos.html">Géneros</a></li>
            <li><a href="admin-membresias.html">Membresías</a></li>
            <li><a href="admin-tarjetas.html">Tarjetas</a></li>
            <li><a href="admin-preguntas.html">Preguntas</a></li>
            <li><a href="admin.html">Panel de Control</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <div class="action-buttons-container">
            <div class="action-buttons">
                <button id="btnCrear">Crear</button>
                <button id="btnEditar">Editar</button>
                <button id="btnObtener">Obtener</button>
            </div>
        </div>

        <div class="content-container">
            <div id="contenidoPreguntas"></div>
        </div>
    </div>

</div>

<footer>
    © 2026 Museo Aurora | Todos los derechos reservados
</footer>

<script>
const navMenu = document.getElementById("navMenu");
const loginButton = document.getElementById("loginButton");
const trabajadorId = localStorage.getItem("trabajadorId");
const trabajadorNombre = localStorage.getItem("trabajadorNombre");
const trabajadorAdmin = localStorage.getItem("trabajadorAdmin");

if (!trabajadorId) {
    console.log("Debe iniciar sesión como trabajador para usar esta página");
    location.href = "login.html";
}

if (trabajadorAdmin === "true") {
    document.getElementById("menuLateral").hidden = false;
}

loginButton.textContent = `Bienvenido, ${trabajadorNombre || "Trabajador"}`;
loginButton.href = "#";

const logoutBtn = document.createElement("a");
logoutBtn.href = "#";
logoutBtn.textContent = "Cerrar Sesión";
logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("trabajadorNombre");
    localStorage.removeItem("trabajadorId");
    localStorage.removeItem("trabajadorAdmin");
    location.reload();
});
navMenu.appendChild(logoutBtn);

const contenido = document.getElementById("contenidoPreguntas");
const endpoint = "http://localhost:8080/query";

function limpiar() {
    contenido.innerHTML = "";
}

async function fetchGraphQL(query, variables = {}) {
    const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables })
    });
    return await res.json();
}
// Mostrar ítems en tarjetas agrupadas
document.getElementById("btnObtener").addEventListener("click", async () => {
    limpiar();

    const query = `
        query ObtenerItems($limit: Int, $offset: Int) {
            Preguntas(limit: $limit, offset: $offset) {
                id
                pregunta
                respuesta
                cliente {
                    nombre
                }
            }
        }
    `;

    const variables = { limit: 100, offset: 0 };
    const data = await fetchGraphQL(query, variables);

    const items = data?.data?.Preguntas;
    if (!items || items.length === 0) {
        contenido.innerHTML = "<p>No hay registros.</p>";
        return;
    }

    // Agrupar por categoría/neutro (antes cliente)
    const groupedItems = {};
    items.forEach(i => {
        const group = i.cliente?.nombre || 'Desconocido';
        if (!groupedItems[group]) groupedItems[group] = [];
        groupedItems[group].push(i);
    });

    // Generar HTML neutral
    let html = '<div class="grid-container"><h3>Registros</h3>';
    for (const group in groupedItems) {
        html += `<div class="grid-item">
                    <h4>${group}</h4>`;
        groupedItems[group].forEach(i => {
            html += `<p><strong>Pregunta:</strong> ${i.pregunta}</p>
                     <p><strong>Respuesta:</strong> ${i.respuesta}</p>
                     <hr>`;
        });
        html += `</div>`;
    }
    html += '</div>';

    contenido.innerHTML = html;
});
// Editar Preguntas
document.getElementById("btnEditar").addEventListener("click", async () => {
    limpiar();
    const query = `
        query ($limit: Int, $offset: Int) {
            Preguntas(limit: $limit, offset: $offset) {
                id
                pregunta
                respuesta
                cliente {
                    nombre
                }
            }
        }
    `;
    const variables = { limit: 100, offset: 0 };
    const data = await fetchGraphQL(query, variables);
    const preguntas = data?.data?.Preguntas;
    if (!preguntas || preguntas.length === 0) {
        contenido.innerHTML = "<p>No hay preguntas para editar.</p>";
        return;
    }
    const opciones = preguntas.map(p => `<option value="${p.id}">${p.pregunta} (Cliente: ${p.cliente?.nombre || 'Desconocido'})</option>`).join("");
    contenido.innerHTML = `
        <select id="selectPregunta" class="select-box">${opciones}</select>
        <form id="updateForm" class="form-container"></form>
    `;
    const form = document.getElementById("updateForm");
    form.classList.add("edit-form");

    function renderForm(pregunta) {
        if (!pregunta) return;
        form.innerHTML = `
            <input type="text" id="pregunta" value="${pregunta.pregunta || ''}" required>
            <input type="text" id="respuesta" value="${pregunta.respuesta || ''}" required>
            <div class="form-buttons">
                <button type="button" id="cancelarEditar" class="btn-cancel">Cancelar</button>
                <button type="submit" class="btn-primary">Actualizar</button>
            </div>
        `;
        document.getElementById("updateForm").addEventListener("submit", async e => {
            e.preventDefault();
            const mutation = `
                mutation updatePreguntas($input: UpdatePreguntas!) {
                    updatePreguntas(input: $input) {
                        id
                        pregunta
                        respuesta
                    }
                }
            `;
            const variables = {
                input: {
                    id: pregunta.id,
                    pregunta: document.getElementById("pregunta").value,
                    respuesta: document.getElementById("respuesta").value
                }
            };
            const result = await fetchGraphQL(mutation, variables);
            if (result.errors) {
                console.error(result.errors);
                alert("Error al actualizar pregunta");
            } else {
                alert("Pregunta actualizada correctamente");
                limpiar();
            }
        });
        document.getElementById("cancelarEditar").addEventListener("click", limpiar);
    }

    renderForm(preguntas[0]);
    document.getElementById("selectPregunta").addEventListener("change", e => {
        const pregunta = preguntas.find(p => p.id === e.target.value);
        renderForm(pregunta);
    });
});
</script>

</body>
</html>
