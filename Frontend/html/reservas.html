<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservas | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/reservas.css">
</head>
<body>

<header>
    <h1>Museo Aurora - Reservas</h1>
    <nav id="navMenu">
        <a href="index.html">Inicio</a>
        <a href="admin.html">Administración</a>
        <a href="login.html" id="loginButton">Iniciar Sesión</a>
    </nav>
</header>

<section>
    <table id="tablaReservas">
        <thead>
            <tr>
                <th>ID Obra</th>
                <th>ID Cliente</th>
                <th>Fecha</th>
                <th>Status</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</section>

<script>
const navMenu = document.getElementById("navMenu");
const loginButton = document.getElementById("loginButton");
const trabajadorId = localStorage.getItem("trabajadorId");
const trabajadorNombre = localStorage.getItem("trabajadorNombre");

if (!trabajadorId) {
    console.log("Debe iniciar sesión como trabajador para usar esta página");
    location.href = "login.html";
}

loginButton.textContent = `Bienvenido, ${trabajadorNombre || "Trabajador"}`;
loginButton.href = "#";

const logoutBtn = document.createElement("a");
logoutBtn.href = "#";
logoutBtn.textContent = "Cerrar Sesión";
logoutBtn.style.marginLeft = "10px";
logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("trabajadorNombre");
    localStorage.removeItem("trabajadorId");
    localStorage.removeItem("trabajadorAdmin");
    location.reload();
});
navMenu.appendChild(logoutBtn);

async function cargarReservas() {
    const query = `
        query {
            Ordenes(limit: 100, offset: 0) {
                id
                id_obra
                id_cliente
                id_trabajador
                fecha
                status
            }
        }
    `;

    try {
        const res = await fetch("http://localhost:8080/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query })
        });

        const data = await res.json();
        console.log("Respuesta GraphQL:", data);

        if (data.errors) {
            console.error("Errores en la query:", data.errors);
            return;
        }

        const ordenes = data?.data?.Ordenes || [];
        const tbody = document.querySelector("#tablaReservas tbody");
        tbody.innerHTML = "";

        ordenes.forEach((orden, index) => {
            const tr = document.createElement("tr");
            let accionHtml = "";

            if (!orden.id_trabajador) {
                accionHtml = `<button data-index="${index}" class="asignarBtn">Asignar</button>`;
            } else {
                accionHtml = `
                    <select data-index="${index}" class="statusSelect">
                        <option value="PENDIENTE" ${orden.status === "PENDIENTE" ? "selected" : ""}>PENDIENTE</option>
                        <option value="CONCRETADA" ${orden.status === "CONCRETADA" ? "selected" : ""}>CONCRETADA</option>
                        <option value="CANCELADA" ${orden.status === "CANCELADA" ? "selected" : ""}>CANCELADA</option>
                    </select>
                    <button data-index="${index}" class="updateStatusBtn">Actualizar</button>
                `;
            }

            tr.innerHTML = `
                <td id="orden-obra">${orden.id_obra}</td>
                <td id="orden-cliente">${orden.id_cliente}</td>
                <td id="orden-fecha">${orden.fecha}</td>
                <td id="orden-status">${orden.status}</td>
                <td id="orden-accion">${accionHtml}</td>
            `;
            tbody.appendChild(tr);
        });

        window.ordenesGlobal = ordenes;

        // Botones de asignar trabajador
        tbody.querySelectorAll(".asignarBtn").forEach(btn => {
            btn.addEventListener("click", () => asignarTrabajador(btn.dataset.index));
        });

        // Botones de actualizar status
        tbody.querySelectorAll(".updateStatusBtn").forEach(btn => {
            btn.addEventListener("click", () => {
                const select = document.querySelector(`select[data-index='${btn.dataset.index}']`);
                cambiarStatus(btn.dataset.index, select.value);
            });
        });

    } catch (err) {
        console.error("Error al cargar órdenes:", err);
    }
}

async function asignarTrabajador(index) {
    const orden = window.ordenesGlobal[index];
    const mutation = `
        mutation UpdateOrden($id: ID!, $id_trabajador: ID!) {
            updateOrden(input: { id: $id, id_trabajador: $id_trabajador }) {
                id
                id_trabajador
            }
        }
    `;

    try {
        const res = await fetch("http://localhost:8080/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                query: mutation,
                variables: { id: orden.id, id_trabajador: trabajadorId }
            })
        });
        const data = await res.json();
        console.log("Resultado asignación:", data);
        if (!data.errors) cargarReservas();
    } catch (err) {
        console.error("Error al asignar trabajador:", err);
    }
}

async function cambiarStatus(index, nuevoStatus) {
    const orden = window.ordenesGlobal[index];
    const mutation = `
        mutation UpdateOrden($id: ID!, $status: StatusOrden!) {
            updateOrden(input: { id: $id, status: $status }) {
                id
                status
            }
        }
    `;

    try {
        const res = await fetch("http://localhost:8080/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                query: mutation,
                variables: { id: orden.id, status: nuevoStatus }
            })
        });
        const data = await res.json();
        console.log("Resultado cambio de status:", data);
        if (!data.errors) cargarReservas();
    } catch (err) {
        console.error("Error al cambiar status:", err);
    }
}

cargarReservas();
</script>

</body>
</html>
