<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

<header>
    <h1>Museo Aurora</h1>
</header>

<section class="login-container">
    <form id="registroForm">
        <div class="registro-container">
            <!-- Caja Cliente -->
            <div class="registro-box">
                <h3>Datos del Cliente</h3>
                <div class="input-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="input-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" required>
                </div>
                <div class="input-group">
                    <label for="login">Usuario</label>
                    <input type="text" id="login" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
            </div>

            <!-- Caja Tarjeta -->
            <div class="registro-box">
                <h3>Datos de la Tarjeta</h3>
                <div class="input-group">
                    <label for="numero_tarjeta">Número de tarjeta</label>
                    <input type="text" id="numero_tarjeta" required>
                </div>
                <div class="input-group">
                    <label for="fecha_expiracion">Fecha de expiración (MM/AA)</label>
                    <input type="text" id="fecha_expiracion" required>
                </div>
                <div class="input-group">
                    <label for="codigo_seguridad_tarjeta">Código de seguridad (CVV)</label>
                    <input type="text" id="codigo_seguridad_tarjeta" required>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-primary">Registrarse</button>

        <p>
            ¿Ya tienes cuenta? 
            <a href="login.html" class="btn-secondary">Iniciar sesión</a>
        </p>
    </form>
</section>

<footer>
    © 2026 Museo Aurora
</footer>

<script>
function generarCodigoSeguridad(longitud = 8) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let result = '';
    for (let i = 0; i < longitud; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

const form = document.getElementById("registroForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const email = document.getElementById("email").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const login = document.getElementById("login").value.trim();
    const password = document.getElementById("password").value.trim();
    const codigoSeguridadCliente = generarCodigoSeguridad(8);

    const numeroTarjeta = document.getElementById("numero_tarjeta").value.trim();
    const fechaExpiracion = document.getElementById("fecha_expiracion").value.trim();
    const codigoSeguridadTarjeta = document.getElementById("codigo_seguridad_tarjeta").value.trim();

    try {
        // 1️⃣ Crear Cliente usando variables GraphQL
        const createClienteQuery = `
            mutation CreateCliente($input: NewCliente!) {
                createCliente(input: $input) {
                    id
                    nombre
                }
            }
        `;
        const clienteVariables = {
            input: {
                nombre,
                email,
                telefono,
                login,
                password,
                codigo_seguridad: codigoSeguridadCliente
            }
        };

        const resCliente = await fetch("http://localhost:8080/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: createClienteQuery, variables: clienteVariables })
        });

        const dataCliente = await resCliente.json();
        if (dataCliente.errors) {
            console.error(dataCliente.errors);
            alert("Error al crear el cliente: " + dataCliente.errors[0].message);
            return;
        }

        const clienteId = dataCliente.data.createCliente.id;

        // 2️⃣ Crear Tarjeta asociada al cliente usando variables GraphQL
        const createTarjetaQuery = `
            mutation CreateTarjeta($input: NewTarjetaCliente!) {
                createTarjetaCliente(input: $input) {
                    id_tarjeta
                }
            }
        `;
        const tarjetaVariables = {
            input: {
                id_cliente: clienteId,
                numero_tarjeta: numeroTarjeta,
                fecha_expiracion: fechaExpiracion,
                codigo_seguridad: codigoSeguridadTarjeta
            }
        };

        const resTarjeta = await fetch("http://localhost:8080/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: createTarjetaQuery, variables: tarjetaVariables })
        });

        const dataTarjeta = await resTarjeta.json();
        if (dataTarjeta.errors) {
            console.error(dataTarjeta.errors);
            alert("Error al crear la tarjeta: " + dataTarjeta.errors[0].message);
            return;
        }

        alert(`Cuenta creada correctamente. Código de seguridad del cliente: ${codigoSeguridadCliente}`);
        window.location.href = "login.html";

    } catch (err) {
        console.error(err);
        alert("Error al crear la cuenta o la tarjeta");
    }
});
</script>

</body>
</html>
