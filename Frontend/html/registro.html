<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

    <header>
        <h1>Museo Aurora</h1>
    </header>

    <section class="login-container">
        <form id="registroForm">
            <div class="registro-container">

                <!-- Caja Cliente -->
                <div class="registro-box">
                    <h3>Datos del Cliente</h3>
                    <div class="input-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" required required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="email">Correo</label>
                        <input type="email" id="email" required required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" required required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="login">Usuario</label>
                        <input type="text" id="login" required required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required required autocomplete="off">
                    </div>
                </div>

                <!-- Caja Tarjeta -->
                <div class="registro-box">
                    <h3>Datos de la Tarjeta</h3>
                    <div class="input-group">
                        <label for="numero_tarjeta">Número de tarjeta</label>
                        <input type="text" id="numero_tarjeta" required required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="tipo">Tipo de tarjeta</label>
                        <select id="tipo" required>
                            <option value="" disabled selected>Selecciona tipo</option>
                            <option value="Crédito">Crédito</option>
                            <option value="Débito">Débito</option>
                            <option value="Prepago">Prepago</option>
                        </select>
                    </div>
                </div>

                <!-- Caja Preguntas -->
                <div class="registro-box">
                    <h3>Preguntas de Seguridad</h3>

                    <div class="input-group">
                        <label for="pregunta1">Pregunta 1</label>
                        <select id="pregunta1" required></select>
                        <input type="text" id="respuesta1" placeholder="Respuesta 1" required required autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="pregunta2">Pregunta 2</label>
                        <select id="pregunta2" required></select>
                        <input type="text" id="respuesta2" placeholder="Respuesta 2" required required autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="pregunta3">Pregunta 3</label>
                        <select id="pregunta3" required></select>
                        <input type="text" id="respuesta3" placeholder="Respuesta 3" required required autocomplete="off">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Registrarse</button>

            <p>
                ¿Ya tienes cuenta?
                <a href="login.html" class="btn-secondary">Iniciar sesión</a>
            </p>
        </form>
    </section>

    <footer>
        © 2026 Museo Aurora
    </footer>

    <script src="../js/registro.js" defer></script> <!-- carga primero el DOM luego el script -->
</body>
</html>
