<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Membresías | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/menu-lateral.css">
</head>
<body>

<header>
    <h1>Gestión de Membresías</h1>
    <nav id="navMenu">
        <a href="index.html">Inicio</a>
        <a href="login.html" id="loginButton">Iniciar Sesión</a>
    </nav>
</header>

<div class="admin-panel">

    <aside class="side-menu" id="menuLateral" hidden>
        <h3>Membresías</h3>
        <ul>
            <li><a href="admin-clientes.html">Clientes</a></li>
            <li><a href="admin-trabajadores.html">Trabajadores</a></li>
            <li><a href="admin-obras.html">Obras</a></li>
            <li><a href="admin-artistas.html">Artistas</a></li>
            <li><a href="admin-generos.html">Géneros</a></li>
            <li><a href="admin-membresias.html">Membresías</a></li>
            <li><a href="admin-tarjetas.html">Tarjetas</a></li>
            <li><a href="consultas.html">Consultas y Reportes</a></li>
            <li><a href="reservas.html" id="menuReserva">Reservas</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <div class="action-buttons-container">
            <div class="action-buttons">
                <button id="btnObtener">Obtener</button>
            </div>
        </div>

        <div class="content-container">
            <div id="contenidoMembresias"></div>
        </div>
    </div>

</div>

<footer>
    © 2026 Museo Aurora | Todos los derechos reservados
</footer>

<script>
const navMenu = document.getElementById("navMenu");
const loginButton = document.getElementById("loginButton");
const trabajadorId = localStorage.getItem("trabajadorId");
const trabajadorNombre = localStorage.getItem("trabajadorNombre");
const trabajadorAdmin = localStorage.getItem("trabajadorAdmin");

if (!trabajadorId) {
    console.log("Debe iniciar sesión como trabajador para usar esta página");
    location.href = "login.html";
}

if (trabajadorAdmin === "true") {
    document.getElementById("menuLateral").hidden = false;
}

loginButton.textContent = `Bienvenido, ${trabajadorNombre || "Trabajador"}`;
loginButton.href = "#";

const logoutBtn = document.createElement("a");
logoutBtn.href = "#";
logoutBtn.textContent = "Cerrar Sesión";
logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("trabajadorNombre");
    localStorage.removeItem("trabajadorId");
    localStorage.removeItem("trabajadorAdmin");
    location.reload();
});
navMenu.appendChild(logoutBtn);

const contenido = document.getElementById("contenidoMembresias");
const endpoint = "http://localhost:8080/query";

function limpiar() {
    contenido.innerHTML = "";
}

async function fetchGraphQL(query, variables = {}) {
    const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables })
    });
    return await res.json();
}

document.getElementById("btnObtener").addEventListener("click", async () => {
    limpiar();

    const query = `
        query ObtenerMembresias($limit: Int, $offset: Int) {
            Membresias(limit: $limit, offset: $offset) {
                id_membresia
                cliente {
                    nombre
                }
                id_tarjeta
                fecha
            }
        }
    `;

    const variables = { limit: 100, offset: 0 };
    const data = await fetchGraphQL(query, variables);
    const membresias = data?.data?.Membresias;

    if (!membresias || membresias.length === 0) {
        contenido.innerHTML = "<p>No hay membresías registradas.</p>";
        return;
    }

    let html = '<div class="list-box"><h3>Membresías Registradas</h3><ul>';
    membresias.forEach(m => {
        html += `
            <li>
                ID Membresía: ${m.id_membresia} | Cliente: ${m.cliente?.nombre || 'N/A'} 
                | ID Tarjeta: ${m.id_tarjeta} | Fecha: ${m.fecha}
            </li>
        `;
    });
    html += '</ul></div>';

    contenido.innerHTML = html;
});
</script>

</body>
</html>
