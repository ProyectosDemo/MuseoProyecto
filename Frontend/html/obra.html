<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Obra | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/obra.css">
</head>
<body>

<header>
    <h1>Museo Aurora</h1>
    <nav id="navMenu">
        <a href="index.html">Inicio</a>
        <a href="exposiciones.html">Exposiciones</a>
        <a href="artistas.html">Artistas</a>
        <a href="login.html" id="loginButton">Iniciar Sesión</a>
    </nav>
</header>

<section class="obra-container">
    <div class="foto-boton">
        <img id="obraFoto" src="" alt="Foto de la obra">
    </div>

    <div class="obra-info">
        <div><span>Nombre:</span> <span id="obraNombre"></span></div>
        <div><span>Artista:</span> <span id="obraArtista"></span></div>
        <div><span>Género:</span> <span id="obraGenero"></span></div>
        <div><span>Precio:</span> <span id="obraPrecio"></span></div>
        <div><span>Fecha de creación:</span> <span id="obraFecha"></span></div>
        <div><span>Estatus:</span> <span id="obraEstatus"></span></div>
        <div><span>Material:</span> <span id="obraMaterial"></span></div>
        <div><span>Peso:</span> <span id="obraPeso"></span></div>
        <div><span>Dimensiones:</span> <span id="obraDimensiones"></span></div>
    </div>
</section>

<script>
const navMenu = document.getElementById("navMenu");
const loginButton = document.getElementById("loginButton");

const nombreCliente = localStorage.getItem("clienteNombre");
const clienteId = localStorage.getItem("clienteId");
const nombreTrabajador = localStorage.getItem("trabajadorNombre");
const esAdmin = localStorage.getItem("trabajadorAdmin") === "true";
let userType = "";

if (nombreCliente) {
    loginButton.textContent = `Bienvenido, ${nombreCliente}`;
    loginButton.href = "#";
    userType = "cliente";
} else if (nombreTrabajador) {
    loginButton.textContent = `Bienvenido, ${nombreTrabajador}`;
    loginButton.href = "#";
    userType = esAdmin ? "admin" : "trabajador";
}

if (userType) {
    const logoutBtn = document.createElement("a");
    logoutBtn.href = "#";
    logoutBtn.textContent = "Cerrar Sesión";
    logoutBtn.style.marginLeft = "10px";
    logoutBtn.addEventListener("click", () => {
        if (userType === "cliente") {
            localStorage.removeItem("clienteNombre");
            localStorage.removeItem("clienteId");
        } else {
            localStorage.removeItem("trabajadorNombre");
            localStorage.removeItem("trabajadorId");
            localStorage.removeItem("trabajadorAdmin");
        }
        location.reload();
    });
    navMenu.appendChild(logoutBtn);

    if (esAdmin) {
        const adminBtn = document.createElement("a");
        adminBtn.href = "admin.html";
        adminBtn.textContent = "Administración";
        adminBtn.style.marginLeft = "10px";
        navMenu.appendChild(adminBtn);
    }
}

const params = new URLSearchParams(window.location.search);
const obraId = params.get("id");

if (obraId) {
    const query = `
        query FindObra($id: ID!) {
            findObra(id: $id) {
                id
                nombre
                artista { nombre }
                genero { nombre }
                precio
                fecha_creacion
                status
                foto
                material
                peso
                dimensiones
            }
        }
    `;

    fetch("http://localhost:8080/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            query,
            variables: { id: String(obraId) }
        })
    })
    .then(res => res.json())
    .then(data => {
        const obra = data?.data?.findObra?.[0];
        if (!obra) return;

        document.getElementById("obraFoto").src = obra.foto;
        document.getElementById("obraNombre").textContent = obra.nombre;
        document.getElementById("obraArtista").textContent = obra.artista?.nombre || "";
        document.getElementById("obraGenero").textContent = obra.genero?.nombre || "";
        document.getElementById("obraPrecio").textContent = "$" + obra.precio;
        document.getElementById("obraFecha").textContent = obra.fecha_creacion;
        document.getElementById("obraEstatus").textContent = obra.status;
        document.getElementById("obraMaterial").textContent = obra.material;
        document.getElementById("obraPeso").textContent = obra.peso + " kg";
        document.getElementById("obraDimensiones").textContent = obra.dimensiones;

        // Agregar botón solo si DISPONIBLE y hay cliente logueado
        if (obra.status === "DISPONIBLE" && clienteId) {
            const btnComprar = document.createElement("button");
            btnComprar.id = "btnComprar";
            btnComprar.textContent = "Comprar";

            btnComprar.addEventListener("click", () => {
                const formDiv = document.createElement("div");
                formDiv.id = "formCodigoSeguridad";
                formDiv.innerHTML = `
                    <input type="password" id="codigoSeguridad" placeholder="Código de seguridad">
                    <button id="btnConfirmar">Confirmar</button>
                `;
                document.querySelector(".foto-boton").appendChild(formDiv);

                const btnConfirmar = formDiv.querySelector("#btnConfirmar");
                btnConfirmar.addEventListener("click", () => {
                    const codigoIngresado = formDiv.querySelector("#codigoSeguridad").value;

                    if (!codigoIngresado) {
                        alert("Debe ingresar el código de seguridad.");
                        return;
                    }

                    // 1️⃣ Validar cliente
                    const queryCliente = `
                        query FindCliente($id: ID!) {
                            findCliente(id: $id) {
                                id
                                codigo_seguridad
                            }
                        }
                    `;
                    fetch("http://localhost:8080/query", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ query: queryCliente, variables: { id: clienteId } })
                    })
                    .then(res => res.json())
                    .then(data => {
                        const cliente = data?.data?.findCliente?.[0];
                        if (!cliente) throw new Error("Cliente no encontrado");

                        if (cliente.codigo_seguridad !== codigoIngresado) {
                            alert("Código de seguridad incorrecto.");
                            throw new Error("Código incorrecto");
                        }

                        // 2️⃣ Actualizar status de la obra
                        const mutationUpdate = `
                            mutation UpdateObra($id: ID!, $status: StatusObra!) {
                                updateObra(input: { id: $id, status: $status }) {
                                    id
                                    status
                                }
                            }
                        `;
                        return fetch("http://localhost:8080/query", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                query: mutationUpdate,
                                variables: { id: obra.id, status: "RESERVADA" }
                            })
                        });
                    })
                    .then(res => res.json())
                    .then(() => {
                        // 3️⃣ Crear orden
                        const mutationCreateOrden = `
                            mutation CreateOrden($input: NewOrden!) {
                                createOrden(input: $input) {
                                    id
                                    status
                                }
                            }
                        `;
                        const fechaActual = new Date().toISOString();
                        return fetch("http://localhost:8080/query", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                query: mutationCreateOrden,
                                variables: {
                                    input: {
                                        id_obra: obra.id,
                                        id_cliente: clienteId,
                                        id_trabajador: null,
                                        fecha: fechaActual,
                                        status: "PENDIENTE"
                                    }
                                }
                            }),
                        });
                    })
                    .then(res => res.json())
                    .then(() => {
                        alert("Obra reservada y orden creada exitosamente!");
                        document.getElementById("obraEstatus").textContent = "RESERVADA";
                        formDiv.remove();
                        btnComprar.remove();
                    })
                    .catch(err => console.error(err));
                });
            });

            document.querySelector(".foto-boton").appendChild(btnComprar);
        }
    })
    .catch(err => {
        console.error(err);
        alert("Error cargando la obra");
    });
}
</script>

</body>
</html>
