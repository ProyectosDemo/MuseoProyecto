<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Obra | Museo Aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/obra.css">
</head>
<body>

    <section class="obra-container">
        <div class="foto-boton">
            <img id="obraFoto" src="" alt="Foto de la obra">
        </div>

        <div class="obra-info">
            <div><span>Nombre:</span> <span id="obraNombre"></span></div>
            <div><span>Artista:</span> <span id="obraArtista"></span></div>
            <div><span>Género:</span> <span id="obraGenero"></span></div>
            <div><span>Precio:</span> <span id="obraPrecio"></span></div>
            <div><span>Fecha de creación:</span> <span id="obraFecha"></span></div>
            <div><span>Estatus:</span> <span id="obraEstatus"></span></div>
            
            <div id="divMaterial"><span>Material:</span> <span id="obraMaterial"></span></div>
            <div id="divPeso"><span>Peso:</span> <span id="obraPeso"></span></div>
            <div id="divDimensiones"><span>Dimensiones:</span> <span id="obraDimensiones"></span></div>
        </div>
    </section>
    <footer>
       © 2026 Museo de Arte Contemporáneo | Todos los derechos reservados
    </footer>

    <script src="../js/menu_superior.js" defer></script>
    <script src="../js/obra.js" defer></script>

</body>
</html>
